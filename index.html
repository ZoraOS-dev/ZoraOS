<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZoraOS</title>

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#0f172a,#111827,#1e3a8a);
  color:white;
  overflow:hidden;
}
#home{
  min-height:100vh;
  transition:.3s;
}
.status{
  display:flex;
  justify-content:space-between;
  padding:18px;
  font-size:14px;
}
h1{
  margin:0;
  padding:40px 20px 0;
  font-size:42px;
}
p{
  padding:0 20px;
  color:#cbd5e1;
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  padding:30px 20px;
}
.icon{
  background:rgba(255,255,255,.08);
  border-radius:22px;
  padding:18px 8px;
  text-align:center;
  backdrop-filter:blur(20px);
  transition:.15s;
}
.icon:active{transform:scale(.82);}
.icon span{
  display:block;
  margin-top:8px;
  font-size:11px;
}
.dock{
  position:fixed;
  left:15px;
  right:15px;
  bottom:18px;
  background:rgba(255,255,255,.12);
  border-radius:30px;
  padding:12px;
  display:flex;
  justify-content:space-around;
  backdrop-filter:blur(20px);
}
.dock-icon{
  width:52px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  border-radius:18px;
  transition:.15s;
}
.dock-icon:active{transform:scale(.8);}
#app{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#111827,#0f172a);
  padding:30px;
  transform:scale(.75);
  opacity:0;
  border-radius:40px;
  pointer-events:none;
  transition:.45s cubic-bezier(.16,1,.3,1);
}
#app.open{
  transform:scale(1);
  opacity:1;
  border-radius:0;
  pointer-events:auto;
}
.back{
  background:rgba(255,255,255,.1);
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:20px;
}
</style>
</head>
