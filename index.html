<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZoraOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  overflow:hidden;
  background:linear-gradient(160deg,#020617,#0f172a,#1e3a8a);
  color:white;
}
.screen{position:fixed;inset:0}

/* LOCK */
#lock{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:70px 24px 40px;
  background:linear-gradient(160deg,#020617,#0f172a,#1e40af);
  transition:transform .35s ease,opacity .35s ease;
}
#clock{
  font-size:72px;
  font-weight:bold;
  text-align:center;
}
#date{
  text-align:center;
  color:#cbd5e1;
}
#hint{
  text-align:center;
  color:#cbd5e1;
  margin-bottom:12px;
}
.bar{
  width:140px;
  height:5px;
  background:white;
  border-radius:99px;
  margin:auto;
}

/* HOME */
#home{display:none;height:100%}
.status{
  display:flex;
  justify-content:space-between;
  padding:18px;
  font-size:14px;
}
h1{padding:32px 20px 0;font-size:42px}
.sub{padding:6px 20px;color:#cbd5e1}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  padding:28px 20px;
}
.icon{
  background:rgba(255,255,255,.08);
  border-radius:22px;
  padding:18px 8px;
  text-align:center;
}
.icon:active{transform:scale(.85)}
.icon span{display:block;font-size:11px;margin-top:8px}

.dock{
  position:fixed;
  left:16px;
  right:16px;
  bottom:18px;
  display:flex;
  justify-content:space-around;
  padding:12px;
  border-radius:28px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(20px);
}

/* APP */
#app{
  position:fixed;
  inset:0;
  background:#111827;
  padding:30px;
  transform:scale(.8);
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
#app.open{
  transform:scale(1);
  opacity:1;
  pointer-events:auto;
}
button{
  background:#334155;
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:14px;
}
</style>
</head>
<body>

<div id="lock" class="screen">
  <div>
    <div id="clock">09:41</div>
    <div id="date">Tuesday • ZoraOS</div>
  </div>
  <div>
    <div id="hint">Swipe up to unlock</div>
    <div class="bar"></div>
  </div>
</div>

<div id="home" class="screen">
  <div class="status">
    <div id="topTime">09:41</div>
    <div>📶 🔋</div>
  </div>

  <h1>ZoraOS</h1>
  <div class="sub">Your world. Your OS.</div>

  <div class="grid">
    <div class="icon" onclick="openApp('Browser')">🌐<span>Browser</span></div>
    <div class="icon" onclick="openApp('Settings')">⚙️<span>Settings</span></div>
    <div class="icon" onclick="openApp('Gallery')">🖼️<span>Gallery</span></div>
    <div class="icon" onclick="openApp('Zora')">✨<span>Zora</span></div>
  </div>

  <div class="dock">
    <div onclick="openApp('Phone')">📞</div>
    <div onclick="openApp('Messages')">💬</div>
    <div onclick="openApp('Camera')">📷</div>
    <div onclick="openApp('Music')">🎵</div>
  </div>
</div>

<div id="app">
  <button
