<title>ZoraOS</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  overflow:hidden;

}
.screen{position:fixed;inset:0}

/* LOCKSCREEN */
#lock{
  display:flex;
  flex-direction:column;
  justify-content:space-between;

  background:linear-gradient(160deg,#020617,#0f172a,#1e40af);
  transition:.4s;
}
.time{
  font-size:72px;
  font-weight:bold;
  text-align:center;
}
.date{
  text-align:center;
  color:#cbd5e1;
  margin-top:8px;
}
.swipe{
  text-align:center;
  color:#cbd5e1;
  margin-bottom:10px;
}
.bar{
  width:140px;
  height:5px;
  background:#fff;
  border-radius:99px;
  margin:auto;
}

}
