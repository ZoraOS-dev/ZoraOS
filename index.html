<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZoraOS</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
    background: #050816;
}

button {
    font-family: inherit;
}

/* =========================
   LOCK SCREEN
========================= */

#lockScreen {
    position: fixed;
    inset: 0;
    z-index: 1000;

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    padding: 65px 24px 35px;

    background:
        radial-gradient(circle at 20% 20%, #263b75 0%, transparent 35%),
        radial-gradient(circle at 80% 70%, #172554 0%, transparent 40%),
        linear-gradient(145deg, #020617, #0f172a);

    transition:
        transform 0.5s cubic-bezier(.16,1,.3,1),
        opacity 0.4s ease;
}

.lockTop {
    text-align: center;
}

#lockTime {
    font-size: 72px;
    font-weight: 700;
    letter-spacing: -3px;
}

#lockDate {
    margin-top: 8px;
    font-size: 15px;
    color: #cbd5e1;
}

.lockBottom {
    text-align: center;
}

#swipeText {
    color: #cbd5e1;
    font-size: 14px;
    margin-bottom: 14px;
}

.swipeBar {
    width: 140px;
    height: 5px;
    margin: auto;
    border-radius: 20px;
    background: white;
    opacity: .9;
}

/* =========================
   HOME SCREEN
========================= */
