<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZoraOS</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
    background: #10182f;
}

/* LOCK SCREEN */
#lock {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;

    padding: 80px 20px 35px;

    background: linear-gradient(160deg, #101b3d, #080b18);

    transition: transform 0.5s ease;
}

#clock {
    font-size: 70px;
    font-weight: bold;
}

#date {
    margin-top: 10px;
    color: #b8c0d9;
    text-align: center;
}

#unlockText {
    color: #cbd5e1;
    margin-bottom: 15px;
}

#bar {
    width: 140px;
    height: 5px;
    background: white;
    border-radius: 20px;
}

/* HOME */
#home {
    position: fixed;
    inset: 0;

    padding: 20px;

    background:
        radial-gradient(circle at 20% 10%, #334b91, transparent 30%),
        radial-gradient(circle at 80% 80%, #253b78, transparent 30%),
        #080d1c;
}

#top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 30px;
}

#logo {
    margin-bottom: 25px;
}

#logo h1 {
    margin: 0;
    font-size: 40px;
}

#logo p {
    margin-top: 5px;
    color: #9ca8c5;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.icon {
    text-align: center;
    cursor: pointer;
}

.iconBox {
    width: 58px;
    height: 58px;
    margin: auto;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 18px;

    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.12);

    font-size: 28px;
}

.name {
    font-size: 11px;
    margin-top: 7px;
}

.icon:active {
    transform: scale(0.8);
}

/* DOCK */
#dock {
    position: absolute;
    left: 15px;
    right: 15px;
    bottom: 18px;

    height: 75px;

    display: flex;
    justify-content: space-around;
    align-items: center;

    border-radius: 25px;

    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.12);
}

.dockIcon {
    font-size: 28px;
    cursor: pointer;
}

.dockIcon:active {
    transform: scale(0.8);
}

/* APP */
#app {
    position: fixed;
    inset: 0;
    z-index: 20;

    display: none;

    padding: 25px;

    background: linear-gradient(150deg, #101b3d, #070a15);
}

#app.open {
    display: block;
}

#back {
    padding: 12px 18px;

    border: none;
    border-radius: 15px;

    background: rgba(255,255,255,0.12);
    color: white;

    font-size: 15px;
}

#appTitle {
    font-size: 32px;
    margin-top: 35px;
}

#appText {
    color: #b8c0d9;
}
</style>
</head>

<body>

<!-- LOCK SCREEN -->
<div id="lock">

    <div>
        <div id="clock">09:41</div>
        <div id="date">Wednesday, 30 September</div>
    </div>

    <div>
        <div id="unlockText">Swipe up to unlock</div>
        <div id="bar"></div>
    </div>

</div>


<!-- HOME SCREEN -->
<div id="home">

    <div id="top">
        <span id="homeClock">09:41</span>
        <span>📶 🔋</span>
    </div>

    <div id="logo">
        <h1>ZoraOS</h1>
        <p>Your world. Your OS.</p>
    </div>

    <div class="grid">

        <div class="icon" onclick="openApp('Browser')">
            <div class="iconBox">🌐</div>
            <div class="name">Browser</div>
        </div>

        <div class="icon" onclick="openApp('Settings')">
            <div class="iconBox">⚙️</div>
            <div class="name">Settings</div>
        </div>

        <div class="icon" onclick="openApp('Gallery')">
            <div class="iconBox">🖼️</div>
            <div class="name">Gallery</div>
        </div>

        <div class="icon" onclick="openApp('Zora')">
            <div class="iconBox">✨</div>
            <div class="name">Zora</div>
        </div>

    </div>


    <div id="dock">

        <div class="dockIcon" onclick="openApp('Phone')">📞</div>
        <div class="dockIcon" onclick="openApp('Messages')">💬</div>
        <div class="dockIcon" onclick="openApp('Camera')">📷</div>
        <div class="dockIcon" onclick="openApp('Music')">🎵</div>

    </div>

</div>


<!-- APP SCREEN -->
<div id="app">

    <button id="back" onclick="closeApp()">← Home</button>

    <h1 id="appTitle">App</h1>

    <p id="appText">
        Welcome to ZoraOS.
    </p>

</div>


<script>

const lock = document.getElementById("lock");
const clock = document.getElementById("clock");
const homeClock = document.getElementById("homeClock");
const date = document.getElementById("date");

function updateTime() {

    const now = new Date();

    const time = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });

    const day = now.toLocaleDateString([], {
        weekday: "long",
        day: "numeric",
        month: "long"
    });

    clock.innerText = time;
    homeClock.innerText = time;
    date.innerText = day;
}

updateTime();
setInterval(updateTime, 1000);


/* SWIPE UNLOCK */

let startY = 0;

lock.addEventListener("touchstart", function(e) {
    startY = e.touches[0].clientY;
});

lock.addEventListener("touchend", function(e) {

    let endY = e.changedTouches[0].clientY;

    if (startY - endY > 50) {
        lock.style.transform = "translateY(-100%)";
    }

});


/* APPS */

function openApp(name) {

    document.getElementById("appTitle").innerText = name;

    document.getElementById("appText").innerText =
        "Welcome to " + name + " on ZoraOS.";

    document.getElementById("app").classList.add("open");
}


function closeApp() {

    document.getElementById("app").classList.remove("open");

}
/* SWIPE DOWN TO CLOSE APP */

const app = document.getElementById("app");

let appStartY = 0;
let appCurrentY = 0;
let appSwiping = false;

app.addEventListener("touchstart", function(e) {
    appStartY = e.touches[0].clientY;
    appCurrentY = appStartY;
    appSwiping = true;
});

app.addEventListener("touchmove", function(e) {

    if (!appSwiping) return;

    appCurrentY = e.touches[0].clientY;

    const distance = appCurrentY - appStartY;

    /* Only allow downward movement */
    if (distance > 0) {

        app.style.transform =
            "translateY(" + distance + "px) scale(" +
            (1 - Math.min(distance / 1500, 0.08)) +
            ")";

        app.style.opacity =
            1 - Math.min(distance / 500, 0.35);
    }

});

app.addEventListener("touchend", function() {

    if (!appSwiping) return;

    const distance = appCurrentY - appStartY;

    appSwiping = false;

    if (distance > 100) {

        /* Close app */

        app.style.transition =
            "transform 0.3s ease, opacity 0.3s ease";

        app.style.transform =
            "translateY(100%) scale(0.9)";

        app.style.opacity = "0";

        setTimeout(function() {

            app.classList.remove("open");

            app.style.transform = "";
            app.style.opacity = "";
            app.style.transition = "";

        }, 300);

    } else {

        /* Snap back */

        app.style.transition =
            "transform 0.25s ease, opacity 0.25s ease";

        app.style.transform = "";
        app.style.opacity = "";

        setTimeout(function() {
            app.style.transition = "";
        }, 250);
    }

});
</script>

</body>
</html>
