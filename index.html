
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>About ZoraOS</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #000;
  --card: #242426;
  --text: #f7f7fb;
  --muted: #99999f;
  --accent: #1685ff;
}

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, Arial, sans-serif;
  padding: 0 18px 35px;
  overflow-x: hidden;
}

/* STATUS BAR */

.status-bar {
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 5px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .2px;
}

.status-right {
  display: flex;
  align-items: center;
  gap: 7px;
}

.status-icon {
  width: 17px;
  height: 17px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.battery {
  background: #ededed;
  color: #333;
  border-radius: 5px;
  padding: 3px 7px;
  font-size: 12px;
  min-width: 42px;
}

/* TOP BAR */

.topbar {
  display: flex;
  align-items: center;
  gap: 17px;
  margin: 14px 0 35px;
}

.back-button {
  width: 66px;
  height: 66px;
  border-radius: 50%;
  background: #242426;
  display: grid;
  place-items: center;
  border: none;
  color: white;
  cursor: pointer;
  transition: background .2s, transform .2s;
}

.back-button:active {
  transform: scale(.92);
  background: #38383b;
}

.back-button svg {
  width: 30px;
  height: 30px;
}

.topbar h1 {
  font-size: 30px;
  font-weight: 750;
  letter-spacing: -.8px;
}

/* SATURN HERO */

.hero {
  height: 420px;
  border-radius: 38px;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 20% 0%,
      #372078 0%, transparent 45%),
    linear-gradient(145deg,
      #09071d 0%,
      #201044 38%,
      #090914 100%);
  border: 1px solid rgba(255,255,255,.06);
  margin-bottom: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Stars */

.stars {
  position: absolute;
  inset: 0;
  opacity: .8;
  background-image:
    radial-gradient(2px 2px at 12% 18%, #fff, transparent),
    radial-gradient(1px 1px at 78% 12%, #fff, transparent),
    radial-gradient(1px 1px at 88% 32%, #d8d4ff, transparent),
    radial-gradient(2px 2px at 25% 48%, #fff, transparent),
    radial-gradient(1px 1px at 65% 62%, #fff, transparent),
    radial-gradient(1px 1px at 18% 78%, #b8b4ff, transparent),
    radial-gradient(2px 2px at 85% 82%, #fff, transparent),
    radial-gradient(1px 1px at 45% 25%, #fff, transparent);
}

/* Saturn rings */

.saturn {
  position: absolute;
  width: 300px;
  height: 300px;
  top: 27px;
  left: 50%;
  transform: translateX(-50%);
  animation: float 7s ease-in-out infinite;
}

.ring {
  position: absolute;
  width: 340px;
  height: 112px;
  left: 50%;
  top: 53%;
  transform: translate(-50%, -50%) rotate(-20deg);
  border-radius: 50%;
  background:
    linear-gradient(
      180deg,
      rgba(255,232,194,.12),
      #f4c78d 15%,
      #d68c61 27%,
      #754b77 42%,
      #e6b9dc 51%,
      #b88bce 64%,
      #f4d6a4 78%,
      rgba(255,255,255,.08) 100%
    );
  box-shadow:
    0 0 25px rgba(201,143,255,.18),
    inset 0 3px 8px rgba(255,255,255,.3);
  -webkit-mask-image: linear-gradient(
    180deg, transparent 0%, #000 18%,
    #000 82%, transparent 100%
  );
  mask-image: linear-gradient(
    180deg, transparent 0%, #000 18%,
    #000 82%, transparent 100%
  );
}

.planet {
  position: absolute;
  width: 190px;
  height: 190px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      rgba(255,255,255,.10) 8px,
      transparent 16px,
      rgba(85,40,90,.12) 24px
    ),
    linear-gradient(
      115deg,
      #ffe7c4 0%,
      #d7a4a3 20%,
      #a875a0 38%,
      #e6c0a4 53%,
      #b9847b 69%,
      #593d76 100%
    );
  box-shadow:
    inset -25px -10px 45px rgba(12,5,35,.7),
    inset 12px 8px 25px rgba(255,255,255,.45),
    0 0 35px rgba(167,116,255,.2);
  overflow: hidden;
}

.planet::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    90deg,
    transparent 30%,
    rgba(255,255,255,.22) 50%,
    transparent 75%
  );
}

/* Ring in front of planet */

.front-ring {
  position: absolute;
  width: 340px;
  height: 112px;
  left: 50%;
  top: 53%;
  transform: translate(-50%, -50%) rotate(-20deg);
  border-radius: 50%;
  border: 13px solid rgba(255,220,183,.78);
  border-left-color: rgba(168,123,190,.75);
  border-right-color: rgba(239,192,150,.9);
  border-bottom-color: rgba(207,164,214,.85);
  clip-path: inset(50% 0 0 0);
  filter: drop-shadow(0 2px 5px rgba(255,210,180,.2));
}

.hero-info {
  position: absolute;
  bottom: 35px;
  left: 24px;
  right: 24px;
  text-align: center;
  z-index: 2;
  text-shadow: 0 2px 12px rgba(0,0,0,.4);
}

.hero-info h2 {
  font-size: 38px;
  font-weight: 750;
  letter-spacing: -1.5px;
  background: linear-gradient(90deg, #f1d8ff, #fff, #d7c7ff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero-info p {
  margin-top: 9px;
  font-size: 17px;
  color: rgba(255,255,255,.78);
  letter-spacing: 1.2px;
}

.version-button {
  margin-top: 20px;
  padding: 13px 24px;
  border-radius: 30px;
  border: 1px solid rgba(255,255,255,.22);
  color: white;
  background: rgba(255,255,255,.13);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: .2s;
}

.version-button:active {
  transform: scale(.96);
  background: rgba(255,255,255,.25);
}

/* INFORMATION CARDS */

.card {
  background: var(--card);
  border-radius: 30px;
  padding: 26px 24px;
  margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,.025);
}

.info-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  min-height: 40px;
}

.info-row h3 {
  font-size: 19px;
  font-weight: 650;
}

.info-row span {
  color: var(--muted);
  font-size: 16px;
  font-weight: 600;
  text-align: right;
}

.separator {
  height: 1px;
  background: rgba(255,255,255,.09);
  margin: 22px 0;
}

.storage-track {
  width: 100%;
  height: 13px;
  background: #39393b;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 17px;
}

.storage-fill {
  height: 100%;
  width: 21%;
  background: #1685ff;
  border-radius: inherit;
  box-shadow: 0 0 12px rgba(22,133,255,.3);
}

.storage-caption {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  font-size: 13px;
  color: var(--muted);
}

.detail-card {
  padding: 26px 24px;
  min-height: 126px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 16px;
}

.detail-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.detail-heading h3 {
  font-size: 20px;
  font-weight: 650;
}

.detail-card p {
  font-size: 16px;
  color: var(--muted);
  font-weight: 600;
  line-height: 1.5;
}

.detail-icon {
  width: 25px;
  height: 25px;
  color: #99999f;
  flex-shrink: 0;
}

/* BOTTOM NAVIGATION */

.gesture-bar {
  width: 120px;
  height: 5px;
  background: #f5f5f5;
  border-radius: 10px;
  margin: 24px auto 0;
  opacity: .85;
}

@keyframes float {
  0%, 100% {
    transform: translate(-50%, 0);
  }
  50% {
    transform: translate(-50%, -8px);
  }
}

@media (max-width: 380px) {
  body {
    padding-left: 13px;
    padding-right: 13px;
  }

  .hero {
    height: 390px;
  }

  .saturn {
    transform: translateX(-50%) scale(.85);
    transform-origin: top center;
  }

  .hero-info h2 {
    font-size: 32px;
  }

  .info-row h3 {
    font-size: 17px;
  }

  .info-row span {
    font-size: 14px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .saturn {
    animation: none;
  }
}
</style>
</head>

<body>

<!-- Status bar -->
<div class="status-bar">
  <span id="time">9:41</span>

  <div class="status-right">
    <span class="status-icon">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M2 8.5 12 1l10 7.5v2.8L12 3.8 2 11.3z"/>
        <path d="M5 12 12 7l7 5v9h-5v-6h-4v6H5z"/>
      </svg>
    </span>

    <span class="status-icon">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <rect x="2" y="14" width="4" height="8" rx="1"/>
        <rect x="9" y="10" width="4" height="12" rx="1"/>
        <rect x="16" y="5" width="4" height="17" rx="1"/>
      </svg>
    </span>

    <span class="battery">66%</span>
  </div>
</div>

<!-- Header -->
<header class="topbar">
  <button class="back-button" onclick="history.back()" aria-label="Go back">
    <svg viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"/>
      <path d="m12 19-7-7 7-7"/>
    </svg>
  </button>

  <h1>About</h1>
</header>

<!-- Saturn hero -->
<section class="hero">
  <div class="stars"></div>

  <div class="saturn">
    <div class="ring"></div>
    <div class="planet"></div>
    <div class="front-ring"></div>
  </div>

  <div class="hero-info">
    <h2>ZoraOS</h2>
    <p>26.3 Beta 7.5.1</p>

    <button class="version-button" onclick="showVersion()">
      Version up to date
    </button>
  </div>
</section>

<!-- Device and storage -->
<section class="card">
  <div class="info-row">
    <h3>Device name</h3>
    <span>SM-A346E</span>
  </div>

  <div class="separator"></div>

  <div class="info-row">
    <h3>Storage</h3>
    <span>47.3 GB / 225 GB</span>
  </div>

  <div class="storage-track">
    <div class="storage-fill"></div>
  </div>

  <div class="storage-caption">
    <span>Used storage</span>
    <span>21% used</span>
  </div>
</section>

<!-- ZoraOS details -->
<section class="card detail-card">
  <div class="detail-heading">
    <h3>ZoraOS</h3>

    <svg class="detail-icon" viewBox="0 0 24 24"
      fill="currentColor">
      <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 4a1.2 1.2 0 1 1 0 2.4A1.2 1.2 0 0 1 12 6Zm2 12h-4v-1.5h1v-4h-1V11h3v5.5h1z"/>
    </svg>
  </div>

  <p>26.3 Beta 7.5.1 · Build 115</p>
</section>

<!-- Android details -->
<section class="card detail-card">
  <div class="detail-heading">
    <h3>Android 16</h3>

    <svg class="detail-icon" viewBox="0 0 24 24"
      fill="currentColor">
      <path d="M7 7 5.5 4.5 6.8 4l1.7 2.7a9 9 0 0 1 7 0L17.2 4l1.3.5L17 7a7.5 7.5 0 0 1 3 6H4a7.5 7.5 0 0 1 3-6ZM8 10a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm8 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2ZM4 14h16v5a2 2 0 0 1-2 2h-1v-3h-2v3H9v-3H7v3H6a2 2 0 0 1-2-2z"/>
    </svg>
  </div>

  <p>Android version</p>
</section>

<div class="gesture-bar"></div>

<script>
function showVersion() {
  alert("You're using ZoraOS 26.3 Beta 7.5.1.");
}

/* Update the clock */
function updateTime() {
  const now = new Date();

  document.getElementById("time").textContent =
    now.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    });
}

updateTime();
setInterval(updateTime, 30000);
</script>

</body>
</html>
