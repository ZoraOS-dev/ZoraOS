<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZoraOS</title><style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:linear-gradient(135deg,#0f172a,#111827,#172554);
  font-family:Arial,sans-serif;
  color:white;
  min-height:100vh;
  overflow:hidden;
}

/* HOME */

#home{
  min-height:100vh;
  animation:homeIn .6s ease;
}

.status{
  display:flex;
  justify-content:space-between;
  padding:18px;
  font-size:14px;
}

h1{
  padding:40px 20px 0;
  font-size:42px;
  margin:0;
}

p{
  padding:0 20px;
  color:#b8b8b8;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  padding:30px 20px;
  text-align:center;
}

.icon{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:18px 8px;
  font-size:28px;
  cursor:pointer;

  backdrop-filter:blur(18px);

  transition:
    transform .18s cubic-bezier(.2,1.4,.4,1),
    background .2s ease,
    box-shadow .2s ease;
}

.icon span{
  display:block;
  font-size:11px;
  margin-top:8px;
}

/* ICON PRESS */

.icon:active{
  transform:scale(.82);
  background:rgba(255,255,255,.18);
  box-shadow:0 0 25px rgba(255,255,255,.12);
}

/* APP */

#app{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#0f172a,#111827);
  padding:30px;

  transform:scale(.75);
  opacity:0;
  border-radius:40px;

  pointer-events:none;

  transition:
    transform .5s cubic-bezier(.16,1,.3,1),
    opacity .3s ease,
    border-radius .5s cubic-bezier(.16,1,.3,1);
}

#app.open{
  transform:scale(1);
  opacity:1;
  border-radius:0;
  pointer-events:auto;
}

#app.closing{
  transform:scale(.75);
  opacity:0;
  border-radius:40px;
}

#app h1{
  padding:40px 0 0;
}

/* BUTTON */

.back{
  border:none;
  background:rgba(255,255,255,.1);
  color:white;
  padding:12px 18px;
  border-radius:20px;
  font-size:15px;
  backdrop-filter:blur(15px);
  cursor:pointer;
  transition:.2s;
}

.back:active{
  transform:scale(.9);
}

/* DOCK */

<div class="dock">
  <div class="dock-icon" onclick="openApp('Phone')">📞</div>
  <div class="dock-icon" onclick="openApp('Messages')">💬</div>
  <div class="dock-icon" onclick="openApp('Camera')">📷</div>
  <div class="dock-icon" onclick="openApp('Music')">🎵</div>
</div>

  .dock-icon{
  width:52px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;
  font-size:28px;
  transition:transform .15s ease;
}

.dock-icon:active{
  transform:scale(.82);
}

/* ANIMATIONS */

@keyframes homeIn{
  from{
    opacity:0;
    transform:scale(.96);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes dockIn{
  from{
    opacity:0;
    transform:translateY(30px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}
</style></head><body><!-- HOME --><div id="home">  <div class="status">
    <div>9:41</div>
    <div>📶 🔋</div>
  </div>  <h1>ZoraOS</h1>  <p>Your world. Your OS.</p>  <div class="grid"><div class="icon" onclick="openApp('Browser')">
  🌐
  <span>Browser</span>
</div>

<div class="icon" onclick="openApp('Settings')">
  ⚙️
  <span>Settings</span>
</div>

<div class="icon" onclick="openApp('Gallery')">
  🖼️
  <span>Gallery</span>
</div>

<div class="icon" onclick="openApp('Zora')">
  ✨
  <span>Zora</span>
</div>

  </div></div><!-- APP --><div id="app"><button class="back" onclick="closeApp()">← Home</button>

  <h1 id="title"></h1>  <p>Welcome to your first ZoraOS app.</p></div><!-- DOCK --><div class="dock">
  📞
  💬
  📷
  🎵
</div><script>

const home = document.getElementById("home");
const app = document.getElementById("app");
const title = document.getElementById("title");

function openApp(name){

  title.innerText = name;

  home.style.opacity = "0";
  home.style.transform = "scale(.96)";

  setTimeout(() => {

    home.style.display = "none";

    app.classList.remove("closing");

    app.classList.add("open");

  },150);
}


function closeApp(){

  app.classList.remove("open");

  app.classList.add("closing");

  setTimeout(() => {

    app.classList.remove("closing");

    app.style.opacity = "";

    app.style.transform = "";

    home.style.display = "block";

    setTimeout(() => {

      home.style.opacity = "1";
      home.style.transform = "scale(1)";

    },30);

  },350);

}

</script></body>
</html>
