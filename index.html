
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZoraOS</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#0f172a,#111827,#1d4ed8);
  color:#fff;
  overflow:hidden;
}
#home{
  min-height:100vh;
  transition:.25s;
}
.status{
  display:flex;
  justify-content:space-between;
  padding:18px;
  font-size:14px;
}
h1{
  padding:30px 20px 0;
  font-size:42px;
}
.subtitle{
  padding:6px 20px;
  color:#cbd5e1;
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  padding:28px 20px;
}
.icon{
  background:rgba(255,255,255,.08);
  border-radius:22px;
  padding:18px 8px;
  text-align:center;
  backdrop-filter:blur(18px);
  transition:transform .15s;
}
.icon:active{transform:scale(.82)}
.icon span{
  display:block;
  margin-top:8px;
  font-size:11px;
}
.dock{
  position:fixed;
  left:16px;
  right:16px;
  bottom:18px;
  display:flex;
  justify-content:space-around;
  padding:12px;
  border-radius:28px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(20px);
}
.dock-icon{
  width:52px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  border-radius:16px;
  transition:.15s;
}
.dock-icon:active{transform:scale(.8)}
#app{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#111827,#0f172a);
  padding:30px;
  transform:scale(.75);
  opacity:0;
  pointer-events:none;
  border-radius:40px;
  transition:.45s cubic-bezier(.16,1,.3,1);
}
#app.open{
  transform:scale(1);
  opacity:1;
  pointer-events:auto;
  border-radius:0;
}
.back{
  border:none;
  color:#fff;
  padding:12px 18px;
  border-radius:18px;
  background:rgba(255,255,255,.1);
}
</style>
</head>
<body>

<div id="home">
  <div class="status">
    <div>9:41</div>
    <div>📶 🔋</div>
  </div>

  <h1>ZoraOS</h1>
  <div class="subtitle">Your world. Your OS.</div>

  <div class="grid">
    <div class="icon" onclick="openApp('Browser')">🌐<span>Browser</span></div>
    <div class="icon" onclick="openApp('Settings')">⚙️<span>Settings</span></div>
    <div class="icon" onclick="openApp('Gallery')">🖼️<span>Gallery</span></div>
    <div class="icon" onclick="openApp('Zora')">✨<span>Zora</span></div>
  </div>

  <div class="dock">
    <div class="dock-icon" onclick="openApp('Phone')">📞</div>
    <div class="dock-icon" onclick="openApp('Messages')">💬</div>
    <div class="dock-icon" onclick="openApp('Camera')">📷</div>
    <div class="dock-icon" onclick="openApp('Music')">🎵</div>
  </div>
</div>

<div id="app">
  <button class="back" onclick="closeApp()">← Home</button>
  <h1 id="title" style="padding:30px 0 10px"></h1>
  <p>Welcome to ZoraOS.</p>
</div>

<script>
const home = document.getElementById("home");
const app = document.getElementById("app");
const title = document.getElementById("title");

function openApp(name){
  title.textContent = name;
  home.style.opacity = "0";
  home.style.transform = "scale(.96)";
  setTimeout(()=>{
    home.style.display = "none";
    app.classList.add("open");
  },150);
}

function closeApp(){
  app.classList.remove("open");
  setTimeout(()=>{
    home.style.display = "block";
    home.style.opacity = "1";
    home.style.transform = "scale(1)";
  },220);
}
</script>

</body>
</html>
