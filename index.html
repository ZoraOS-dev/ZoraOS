<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>ZoraOS</title>

<style>

:root {
    --text: #ffffff;
    --muted: #c9d2e3;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #000;
    color: white;

    font-family: Arial, Helvetica, sans-serif;
}

button {
    font: inherit;
}


/* =========================
   LOCK SCREEN
========================= */

#lockScreen {

    position: fixed;
    inset: 0;

    z-index: 1000;

    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;

    padding:
        72px
        22px
        calc(28px + env(safe-area-inset-bottom));

    background:

        radial-gradient(
            circle at 20% 15%,
            rgba(137, 53, 255, .85),
            transparent 31%
        ),

        radial-gradient(
            circle at 76% 82%,
            rgba(0, 218, 235, .55),
            transparent 38%
        ),

        linear-gradient(
            150deg,
            #081321 0%,
            #0a1020 60%,
            #06111f 100%
        );

    transition:
        transform .48s cubic-bezier(.2,.8,.2,1),
        opacity .35s ease;
}

.lockClock {
    text-align: center;

    text-shadow:
        0 4px 24px rgba(0,0,0,.25);
}

#lockTime {

    font-size: 72px;

    line-height: .95;

    font-weight: 700;

    letter-spacing: -4px;
}

#lockDate {

    margin-top: 12px;

    font-size: 15px;

    color: #e6ebf3;
}

.lockHint {
    text-align: center;
}

.lockHint p {

    margin: 0 0 14px;

    color: #e7edf7;

    font-size: 14px;
}

.homeBar {

    width: 138px;
    height: 5px;

    border-radius: 99px;

    background: white;

    margin: auto;
}


/* =========================
   HOME SCREEN
========================= */

#homeScreen {

    position: fixed;
    inset: 0;

    z-index: 1;

    padding:
        calc(18px + env(safe-area-inset-top))
        20px
        calc(132px + env(safe-area-inset-bottom));

    background:

        radial-gradient(
            circle at 17% 17%,
            rgba(142,43,255,.92),
            transparent 30%
        ),

        radial-gradient(
            circle at 82% 82%,
            rgba(0,221,238,.72),
            transparent 32%
        ),

        linear-gradient(
            160deg,
            #0b1020 0%,
            #10192d 50%,
            #061522 100%
        );
}


/* STATUS BAR */

.statusBar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 14px;

    font-weight: 700;
}


/* BRAND */

.brand {

    margin-top: 30px;

    margin-bottom: 34px;
}

.brand h1 {

    margin: 0;

    font-size: 44px;

    letter-spacing: -1.6px;
}

.brand p {

    margin: 7px 0 0;

    color: var(--muted);

    font-size: 14px;
}


/* =========================
   APP GRID
========================= */

.grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    column-gap: 16px;

    row-gap: 28px;
}

.appIcon {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 7px;

    user-select: none;

    cursor: pointer;

    transition:
        transform .13s ease;
}

.appIcon:active {

    transform: scale(.84);
}


/* REAL ICONS */

.appIcon img {

    width: 68px;
    height: 68px;

    object-fit: contain;

    border-radius: 22px;

    filter:
        drop-shadow(
            0 9px 16px rgba(0,0,0,.28)
        );
}


/* SNAKE */

.snakeIcon {

    width: 68px;
    height: 68px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 38px;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #16b85d,
            #0b8846
        );

    border:
        1px solid
        rgba(255,255,255,.22);

    box-shadow:

        inset
        0 1px 2px
        rgba(255,255,255,.24),

        0 9px 16px
        rgba(0,0,0,.28);
}

.appLabel {

    font-size: 12px;

    color: white;

    text-shadow:
        0 2px 8px rgba(0,0,0,.4);

    white-space: nowrap;
}


/* =========================
   DOCK
========================= */

#dock {

    position: absolute;

    left: 18px;
    right: 18px;

    /* RAISED DOCK */
    bottom:
        calc(
            30px +
            env(safe-area-inset-bottom)
        );

    height: 92px;

    border-radius: 34px;

    background:
        rgba(255,255,255,.13);

    border:
        1px solid
        rgba(255,255,255,.17);

    backdrop-filter:
        blur(24px);

    -webkit-backdrop-filter:
        blur(24px);

    box-shadow:

        0 16px 35px
        rgba(0,0,0,.30),

        inset
        0 1px 1px
        rgba(255,255,255,.1);

    display: flex;

    align-items: center;

    justify-content: space-around;

    padding: 0 10px;
}

.dockApp {

    cursor: pointer;

    transition:
        transform .13s ease;
}

.dockApp:active {

    transform: scale(.82);
}

.dockApp img {

    width: 68px;
    height: 68px;

    object-fit: contain;

    display: block;

    filter:
        drop-shadow(
            0 8px 14px
            rgba(0,0,0,.28)
        );
}


/* =========================
   APP SCREEN
========================= */

#appScreen {

    position: fixed;

    inset: 0;

    z-index: 50;

    display: none;

    background:

        radial-gradient(
            circle at 70% 5%,
            rgba(70,113,255,.35),
            transparent 32%
        ),

        linear-gradient(
            160deg,
            #0b1425,
            #060b13 70%
        );

    transform:
        translateY(18px)
        scale(.94);

    opacity: 0;

    transition:

        transform .34s cubic-bezier(.2,.8,.2,1),

        opacity .25s ease,

        border-radius .34s ease;

    border-radius: 30px;

    overflow: hidden;

    touch-action: none;
}

#appScreen.open {

    display: block;
}

#appScreen.visible {

    transform:
        translateY(0)
        scale(1);

    opacity: 1;

    border-radius: 0;
}


/* APP HEADER */

.appTop {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        calc(
            18px +
            env(safe-area-inset-top)
        )
        18px
        12px;
}

.backBtn {

    border: 0;

    color: white;

    background:
        rgba(255,255,255,.11);

    padding: 10px 14px;

    border-radius: 16px;

    cursor: pointer;
}

#appTitle {

    font-size: 18px;

    font-weight: 700;
}


/* APP CONTENT */

.appBody {

    padding: 20px;
}

.appCard {

    margin-top: 10px;

    padding: 24px;

    border-radius: 26px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.08);

    backdrop-filter:
        blur(16px);

    -webkit-backdrop-filter:
        blur(16px);
}

.bigAppIcon {

    width: 82px;
    height: 82px;

    object-fit: contain;

    display: block;

    margin-bottom: 18px;
}

.appCard h2 {

    margin: 0 0 8px;

    font-size: 30px;
}

.appCard p {

    margin: 0;

    color: #cbd5e1;

    line-height: 1.45;
}


/* APP HOME BAR */

.gestureBar {

    position: absolute;

    left: 50%;

    bottom:
        calc(
            10px +
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    width: 120px;

    height: 5px;

    border-radius: 99px;

    background: white;

    opacity: .9;
}

</style>
</head>


<body>


<!-- =========================
     LOCK SCREEN
========================= -->

<div id="lockScreen">

    <div class="lockClock">

        <div id="lockTime">
            09:41
        </div>

        <div id="lockDate">
            Tuesday, 6 October
        </div>

    </div>


    <div class="lockHint">

        <p>
            Swipe up to unlock
        </p>

        <div class="homeBar"></div>

    </div>

</div>



<!-- =========================
     HOME SCREEN
========================= -->

<div id="homeScreen">


    <div class="statusBar">

        <span id="homeTime">
            09:41
        </span>

        <span>
            ● Wi-Fi ▮▮▮ 🔋
        </span>

    </div>


    <div class="brand">

        <h1>
            ZoraOS
        </h1>

        <p>
            Your world. Your OS.
        </p>

    </div>



    <div class="grid">


        <!-- PHONE -->

        <div
            class="appIcon"
            onclick="openApp(
                'Phone',
                'icons/phone.png'
            )"
        >

            <img
                src="icons/phone.png"
                alt=""
            >

            <div class="appLabel">
                Phone
            </div>

        </div>


        <!-- MESSAGES -->

        <div
            class="appIcon"
            onclick="openApp(
                'Messages',
                'icons/messages.png'
            )"
        >

            <img
                src="icons/messages.png"
                alt=""
            >

            <div class="appLabel">
                Messages
            </div>

        </div>


        <!-- CAMERA -->

        <div
            class="appIcon"
            onclick="openApp(
                'Camera',
                'icons/camera.png'
            )"
        >

            <img
                src="icons/camera.png"
                alt=""
            >

            <div class="appLabel">
                Camera
            </div>

        </div>


        <!-- MUSIC -->

        <div
            class="appIcon"
            onclick="openApp(
                'Music',
                'icons/music.png'
            )"
        >

            <img
                src="icons/music.png"
                alt=""
            >

            <div class="appLabel">
                Music
            </div>

        </div>


        <!-- PHOTOS -->

        <div
            class="appIcon"
            onclick="openApp(
                'Photos',
                'icons/photos.png'
            )"
        >

            <img
                src="icons/photos.png"
                alt=""
            >

            <div class="appLabel">
                Photos
            </div>

        </div>


        <!-- NOTES -->

        <div
            class="appIcon"
            onclick="openApp(
                'Notes',
                'icons/notes.png'
            )"
        >

            <img
                src="icons/notes.png"
                alt=""
            >

            <div class="appLabel">
                Notes
            </div>

        </div>


        <!-- SETTINGS -->

        <div
            class="appIcon"
            onclick="openApp(
                'Settings',
                'icons/settings.png'
            )"
        >

            <img
                src="icons/settings.png"
                alt=""
            >

            <div class="appLabel">
                Settings
            </div>

        </div>


        <!-- SNAKE -->

        <div
            class="appIcon"
            onclick="openApp(
                'Snake',
                'snake'
            )"
        >

            <div class="snakeIcon">
                🐍
            </div>

            <div class="appLabel">
                Snake
            </div>

        </div>

    </div>



    <!-- =========================
         DOCK
    ========================= -->

    <div id="dock">


        <div
            class="dockApp"
            onclick="openApp(
                'Phone',
                'icons/phone.png'
            )"
        >

            <img
                src="icons/phone.png"
                alt=""
            >

        </div>


        <div
            class="dockApp"
            onclick="openApp(
                'Messages',
                'icons/messages.png'
            )"
        >

            <img
                src="icons/messages.png"
                alt=""
            >

        </div>


        <div
            class="dockApp"
            onclick="openApp(
                'Camera',
                'icons/camera.png'
            )"
        >

            <img
                src="icons/camera.png"
                alt=""
            >

        </div>


        <div
            class="dockApp"
            onclick="openApp(
                'Music',
                'icons/music.png'
            )"
        >

            <img
                src="icons/music.png"
                alt=""
            >

        </div>


    </div>

</div>



<!-- =========================
     APP SCREEN
========================= -->

<div id="appScreen">


    <div class="appTop">

        <button
            class="backBtn"
            onclick="closeApp()"
        >
            ← Home
        </button>

        <div id="appTitle">
            App
        </div>

        <div style="width:70px"></div>

    </div>


    <div class="appBody">

        <div class="appCard">


            <img
                id="appIconImage"
                class="bigAppIcon"
                src="icons/phone.png"
                alt=""
            >


            <div
                id="snakeBig"
                class="snakeIcon"
                style="
                    width:82px;
                    height:82px;
                    margin-bottom:18px;
                    display:none;
                "
            >
                🐍
            </div>


            <h2 id="appHeading">
                App
            </h2>


            <p id="appDescription">
                Welcome to ZoraOS.
            </p>


        </div>

    </div>


    <div class="gestureBar"></div>

</div>



<script>


/* =========================
   ELEMENTS
========================= */

const lockScreen =
    document.getElementById(
        "lockScreen"
    );

const appScreen =
    document.getElementById(
        "appScreen"
    );

const appTitle =
    document.getElementById(
        "appTitle"
    );

const appHeading =
    document.getElementById(
        "appHeading"
    );

const appDescription =
    document.getElementById(
        "appDescription"
    );

const appIconImage =
    document.getElementById(
        "appIconImage"
    );

const snakeBig =
    document.getElementById(
        "snakeBig"
    );


/* =========================
   CLOCK
========================= */

function updateClock() {

    const now =
        new Date();


    const time =
        now.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    const date =
        now.toLocaleDateString(
            [],
            {
                weekday: "long",
                day: "numeric",
                month: "long"
            }
        );


    document.getElementById(
        "lockTime"
    ).textContent = time;


    document.getElementById(
        "homeTime"
    ).textContent = time;


    document.getElementById(
        "lockDate"
    ).textContent = date;

}


updateClock();

setInterval(
    updateClock,
    1000
);



/* =========================
   SWIPE UP UNLOCK
========================= */

let lockStartY = 0;


lockScreen.addEventListener(
    "touchstart",
    function(e) {

        lockStartY =
            e.touches[0].clientY;

    },
    {
        passive: true
    }
);


lockScreen.addEventListener(
    "touchend",
    function(e) {

        const endY =
            e.changedTouches[0].clientY;


        if (
            lockStartY - endY > 55
        ) {

            lockScreen.style.transform =
                "translateY(-100%)";

            lockScreen.style.opacity =
                "0";


            setTimeout(
                function() {

                    lockScreen.style.display =
                        "none";

                },
                480
            );

        }

    },
    {
        passive: true
    }
);



/* =========================
   OPEN APP
========================= */

function openApp(
    name,
    icon
) {

    appTitle.textContent =
        name;


    appHeading.textContent =
        name;


    appDescription.textContent =
        "Welcome to " +
        name +
        " on ZoraOS.";


    if (
        icon === "snake"
    ) {

        appIconImage.style.display =
            "none";

        snakeBig.style.display =
            "flex";

    }

    else {

        snakeBig.style.display =
            "none";

        appIconImage.style.display =
            "block";

        appIconImage.src =
            icon;

    }


    appScreen.style.display =
        "block";


    appScreen.classList.add(
        "open"
    );


    requestAnimationFrame(
        function() {

            requestAnimationFrame(
                function() {

                    appScreen.classList.add(
                        "visible"
                    );

                }
            );

        }
    );

}



/* =========================
   CLOSE APP
========================= */

function finishClose() {

    appScreen.classList.remove(
        "visible"
    );


    setTimeout(
        function() {

            appScreen.classList.remove(
                "open"
            );

            appScreen.style.display =
                "none";

            appScreen.style.transform =
                "";

            appScreen.style.opacity =
                "";

            appScreen.style.transition =
                "";

            appScreen.style.borderRadius =
                "";

        },
        300
    );

}


function closeApp() {

    finishClose();

}



/* =========================
   SWIPE DOWN TO CLOSE
========================= */

let startY = 0;

let currentY = 0;

let dragging = false;


appScreen.addEventListener(
    "touchstart",
    function(e) {

        startY =
            e.touches[0].clientY;

        currentY =
            startY;

        dragging =
            true;


        appScreen.style.transition =
            "none";

    },
    {
        passive: true
    }
);


appScreen.addEventListener(
    "touchmove",
    function(e) {

        if (!dragging)
            return;


        currentY =
            e.touches[0].clientY;


        const distance =
            Math.max(
                0,
                currentY - startY
            );


        if (
            distance > 0
        ) {

            const scale =
                1 -
                Math.min(
                    distance / 1600,
                    .07
                );


            const opacity =
                1 -
                Math.min(
                    distance / 650,
                    .35
                );


            appScreen.style.transform =
                "translateY(" +
                distance +
                "px) scale(" +
                scale +
                ")";


            appScreen.style.opacity =
                opacity;


            appScreen.style.borderRadius =
                Math.min(
                    distance / 5,
                    34
                ) + "px";

        }

    },
    {
        passive: true
    }
);


appScreen.addEventListener(
    "touchend",
    function() {

        if (!dragging)
            return;


        dragging =
            false;


        const distance =
            currentY - startY;


        appScreen.style.transition =
            "transform .30s cubic-bezier(.2,.8,.2,1), opacity .25s ease, border-radius .3s ease";


        if (
            distance > 105
        ) {

            appScreen.style.transform =
                "translateY(105%) scale(.92)";

            appScreen.style.opacity =
                "0";


            setTimeout(
                function() {

                    appScreen.classList.remove(
                        "visible",
                        "open"
                    );


                    appScreen.style.display =
                        "none";


                    appScreen.style.transform =
                        "";

                    appScreen.style.opacity =
                        "";

                    appScreen.style.transition =
                        "";

                    appScreen.style.borderRadius =
                        "";

                },
                300
            );

        }

        else {

            appScreen.style.transform =
                "translateY(0) scale(1)";

            appScreen.style.opacity =
                "1";

            appScreen.style.borderRadius =
                "0";


            setTimeout(
                function() {

                    appScreen.style.transition =
                        "";

                },
                300
            );

        }

    },
    {
        passive: true
    }
);

</script>

</body>
          </html>
