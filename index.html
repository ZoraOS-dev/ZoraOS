<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZoraOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:linear-gradient(160deg,#020617,#0f172a,#1e3a8a);
  color:#fff;overflow:hidden;
}
.screen{position:fixed;inset:0}

/* LOCKSCREEN */
#lock{
  display:flex;flex-direction:column;justify-content:space-between;
  padding:70px 24px 40px;
  background:linear-gradient(160deg,#020617,#0f172a,#1e40af);
  transition:.35s;
}
#clock{font-size:68px;font-weight:700;text-align:center}
#date{text-align:center;color:#cbd5e1}
#hint{text-align:center;color:#cbd5e1}
.bar{width:140px;height:5px;background:#fff;border-radius:99px;margin:14px auto}

/* HOME */
#home{display:none;opacity:1;transition:.25s}
.status{display:flex;justify-content:space-between;padding:18px;font-size:14px}
h1{padding:32px 20px 0;font-size:42px}
.sub{padding:6px 20px;color:#cbd5e1}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;padding:28px 20px;
}
.icon{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:18px 8px;
  text-align:center;
  backdrop-filter:blur(18px);
  transition:transform .15s;
}
.icon:active{transform:scale(.82)}
.icon span{display:block;font-size:11px;margin-top:8px}
.dock{
  position:fixed;left:16px;right:16px;bottom:18px;
  display:flex;justify-content:space-around;
  padding:12px;border-radius:28px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(20px);
}
.dock div{font-size:28px;transition:.15s}
.dock div:active{transform:scale(.8)}

/* APP */
#app{
  position:fixed;inset:0;
  background:linear-gradient(160deg,#111827,#0f172a);
  padding:30px;
  transform:scale(.75);
  opacity:0;
  pointer-events:none;
  border-radius:40px;
  transition:.4s cubic-bezier(.16,1,.3,1);
}
#app.open{
  transform:scale(1);
  opacity:1;
  pointer-events:auto;
  border-radius:0;
}
button{
  border:none;
  background:rgba(255,255,255,.1);
  color:#fff;
  padding:10px 16px;
  border-radius:16px;
}
</style>
</head>
<body>

<!-- LOCK -->
<div id="lock" class="screen">
  <div>
    <div id="clock">09:41</div>
    <div id="date">Tuesday · ZoraOS</div>
  </div>
  <div>
    <div id="hint">Swipe up to unlock</div>
    <div class="bar"></div>
  </div>
</div>

<!-- HOME -->
<div id="home" class="screen">
  <div class="status">
    <div id="topTime">09:41</div>
    <div>📶 🔋</div>
  </div>

  <h1>ZoraOS</h1>
  <div class="sub">Your world. Your OS.</div>

  <div class="grid">
    <div class="icon" onclick="openApp('Browser')">🌐<span>Browser</span></div>
    <div class="icon" onclick="openApp('Settings')">⚙️<span>Settings</span></div>
    <div class="icon" onclick="openApp('Gallery')">🖼️<span>Gallery</span></div>
    <div class="icon" onclick="openApp('Zora')">✨<span>Zora</span></div>
  </div>

  <div class="dock">
    <div onclick="openApp('Phone')">📞</div>
    <div onclick="openApp('Messages')">💬</div>
    <div onclick="openApp('Camera')">📷</div>
    <div onclick="openApp('Music')">🎵</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <button onclick="closeApp()">← Home</button>
  <h1 id="title" style="margin-top:24px"></h1>
  <p>Welcome to ZoraOS.</p>
</div>

<script>
const lock=document.getElementById("lock"),
home=document.getElementById("home"),
app=document.getElementById("app"),
title=document.getElementById("title"),
clockEl=document.getElementById("clock"),
topTime=document.getElementById("topTime");

function updateClock(){
  const t=new Date().toLocaleTimeString([],{
    hour:"2-digit",minute:"2-digit"
  });
  clockEl.textContent=t;
  topTime.textContent=t;
}
updateClock();
setInterval(updateClock,1000);

// Swipe unlock
let startY=0;
lock.addEventListener("touchstart",e=>startY=e.touches[0].clientY);
lock.addEventListener("touchend",e=>{
  if(startY-e.changedTouches[0].clientY>80){
    lock.style.transform="translateY(-100%)";
    lock.style.opacity="0";
    setTimeout(()=>{
      lock.style.display="none";
      home.style.display="block";
    },300);
  }
});

// Apps
function openApp(name){
  title.textContent=name;
  home.style.opacity="0";
  home.style.transform="scale(.96)";
  setTimeout(()=>{
    home.style.display="none";
    app.classList.add("open");
  },150);
}
function closeApp(){
  app.classList.remove("open");
  setTimeout(()=>{
    home.style.display="block";
    home.style.opacity="1";
    home.style.transform="scale(1)";
  },220);
}
</script>
</body>
</html>
